      <!-- メインコンテンツ -->
      <main class="app-main schedule-main" id="mainContent">

        <h1 class="page-header heading-xl">引き当てチェック</h1>

        <!-- コントロール行（対象期間・引き当て実行・検索・ステータス） -->
        <div class="schedule-control-row">
          <div class="schedule-date-group">
            <label for="allocationDateFrom" class="schedule-date-label">開始日</label>
            <input
              type="date"
              id="allocationDateFrom"
              class="form-input date-input"
              aria-label="開始日を選択"
            >
          </div>
          <span class="schedule-date-separator">〜</span>
          <div class="schedule-date-group">
            <label for="allocationDateTo" class="schedule-date-label">終了日</label>
            <input
              type="date"
              id="allocationDateTo"
              class="form-input date-input"
              aria-label="終了日を選択"
            >
          </div>
          <button
            type="button"
            id="allocationRunBtn"
            class="btn btn-primary"
            onclick="runAllocationCheck()"
          >引き当て実行</button>

          <div class="schedule-search-group">
            <label for="allocationSearch" class="schedule-date-label">検索</label>
            <input
              type="text"
              id="allocationSearch"
              class="form-input schedule-search-input"
              placeholder="受注No・出荷先"
              autocomplete="off"
              aria-label="テーブル検索"
              oninput="setAllocationKeyword(this.value)"
            >
          </div>

          <div class="schedule-status-group">
            <span class="schedule-date-label">ステータス</span>
            <label class="schedule-status-option">
              <input type="checkbox" onchange="toggleAllocationStatusFilter('allocated')">
              引き当て済み
            </label>
            <label class="schedule-status-option">
              <input type="checkbox" checked onchange="toggleAllocationStatusFilter('draft')">
              出荷予定
            </label>
          </div>

          <span id="scheduleUpdatedAt" class="schedule-updated-at body-s text-subtle"></span>
        </div>

        <!-- 引き当て結果（ステータス別の2ブロック）。main.js が描画する -->
        <div class="schedule-sections" id="allocationSections"></div>

      </main>
    </div>

  <!-- 確認モーダル（「引き当て済みに変更」と「削除」で共用。内容は main.js が差し替える） -->
  <div id="allocationConfirmModal" class="ds-modal-overlay" style="display:none"
       role="dialog" aria-modal="true" aria-labelledby="allocationConfirmModalTitle">
    <div class="ds-modal">
      <div class="ds-modal-header">
        <h2 class="heading-s" id="allocationConfirmModalTitle">確認</h2>
      </div>
      <div class="ds-modal-body">
        <p class="body-m" id="allocationConfirmMessage"></p>
        <table class="modal-confirm-table" id="allocationConfirmItems"><tbody></tbody></table>
      </div>
      <div class="ds-modal-footer">
        <button type="button" class="btn btn-default" onclick="closeAllocationConfirm(false)">キャンセル</button>
        <button type="button" class="btn btn-primary" id="allocationConfirmYes" onclick="closeAllocationConfirm(true)">OK</button>
      </div>
    </div>
  </div>

  <!-- トースト通知の表示領域 -->
  <div class="toast-container" id="toastContainer" role="region" aria-label="通知" aria-live="polite"></div>

  <script src="../static/js/sticky-notes.js"></script>
  <script src="../static/js/main.js"></script>
  <script>
    initAllocationCheck();
